<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Iron Tide: Naval Command</title>
<style>
:root{--pn:rgba(8,20,30,.78);--fg:#eaf3f8;--ac:#f2b441;--bd:rgba(255,255,255,.16);--ok:#5fd38d;--bad:#ef5b4c;--t:calc(12px + env(safe-area-inset-top,0px));--b:calc(12px + env(safe-area-inset-bottom,0px));color-scheme:dark;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pn:rgba(8,20,30,.78)}}
:root[data-theme="dark"]{--pn:rgba(8,20,30,.78)}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#9fc0d6;font:13px/1.4 system-ui,"Segoe UI",Arial,sans-serif;color:var(--fg);user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.p{position:fixed;background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;backdrop-filter:blur(4px)}
.bar{height:8px;background:rgba(255,255,255,.14);border-radius:4px;overflow:hidden;margin:5px 0}.bar i{display:block;height:100%;background:var(--ok);width:100%}
#hp{left:12px;top:var(--t);width:210px}#top{left:50%;top:var(--t);transform:translateX(-50%);white-space:nowrap}
#mm{right:12px;bottom:var(--b);padding:0}#thr{left:50%;bottom:var(--b);transform:translateX(-50%);text-align:center;min-width:230px}
#help{left:12px;bottom:var(--b);font-size:12px;opacity:.85;line-height:1.6}
#cross{position:fixed;left:50%;top:50%;width:26px;height:26px;margin:-13px;border:2px solid #fff9;border-radius:50%;pointer-events:none}
#cross:after{content:"";position:absolute;left:11px;top:11px;width:4px;height:4px;background:var(--ac);border-radius:50%}
#rngt{position:fixed;left:50%;top:calc(50% + 24px);transform:translateX(-50%);font-weight:600;text-shadow:0 1px 3px #000;pointer-events:none}
#msg{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-size:24px;font-weight:700;color:var(--ac);text-shadow:0 2px 6px #000;pointer-events:none;text-align:center}
#rl{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:230px;pointer-events:none}
.eb{position:fixed;width:56px;margin-left:-28px;pointer-events:none;font-size:10px;text-align:center;text-shadow:0 1px 2px #000}.eb .bar{height:5px;margin:2px 0}.eb .bar i{background:var(--bad)}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 12px calc(24px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent 35%,rgba(5,14,22,.85));text-align:center}
h1{margin:0 0 4px;font-size:clamp(28px,5vw,46px);letter-spacing:.08em;text-shadow:0 2px 12px #000}
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px;max-width:1100px}
.card{width:190px;text-align:left;background:var(--pn);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer;font:inherit}
.card:hover{border-color:var(--ac);transform:translateY(-3px)}.card b{font-size:15px;color:var(--ac)}.card p{margin:4px 0 8px;font-size:11px;opacity:.8;min-height:30px}
.st{display:flex;align-items:center;gap:6px;font-size:10px}.st span{width:52px;opacity:.75}.st .bar{flex:1;margin:2px 0}.st .bar i{background:var(--ac)}
.btn{margin-top:12px;padding:10px 22px;border-radius:8px;border:0;background:var(--ac);color:#1b1304;font-weight:700;font-size:15px;cursor:pointer}
#menu{overflow-y:auto;justify-content:flex-start}#menu>h1{margin-top:auto}#cards{flex-wrap:nowrap!important;flex-shrink:0}#cards>div{flex-shrink:0}.card .st:nth-of-type(4){display:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud" hidden>
<div class="p" id="hp"><b id="nm"></b><div class="bar"><i id="hpf"></i></div><span id="hpt"></span></div>
<div class="p" id="top">Wave <b id="wv">1</b> · Score <b id="sc">0</b> · Enemies <b id="en">0</b></div>
<canvas class="p" id="mm" width="170" height="170"></canvas>
<div class="p" id="thr"></div><div id="rl"></div>
<div id="cross"></div><div id="rngt"></div><div id="msg"></div>
<div class="p" id="help">W/S throttle · A/D rudder · Mouse aim (click to capture)<br>Click / Space: main guns · T: torpedoes · Shift: zoom · Q/E: turn camera · X: stop</div>
</div>
<div class="ov" id="menu"><h1>IRON TIDE</h1><div>Choose your ship and defeat the enemy fleet</div><div class="cards" id="cards"></div></div>
<div class="ov" id="over" hidden><h1 id="ot">SHIP LOST</h1><div id="os"></div><button class="btn" id="again">Return to port</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=i=>document.getElementById(i),R=Math.random,TAU=Math.PI*2,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),G=55;
const SH={
dd:{n:'Destroyer',L:30,B:4.2,hp:2400,spd:22,turn:.6,mt:[.3,-.3],bar:1,dmg:45,rl:2.5,rng:280,tor:4,td:1600,col:0x7d8c96,fn:1,pts:100,ds:'Fast and fragile. Torpedo spread, light guns.'},
lc:{n:'Light Cruiser',L:40,B:5.2,hp:4200,spd:18,turn:.45,mt:[.32,.18,-.3],bar:2,dmg:45,rl:5,rng:320,tor:3,td:1200,col:0x6d7f8c,fn:2,pts:200,ds:'Rapid six-gun salvos plus torpedoes.'},
hc:{n:'Heavy Cruiser',L:50,B:6.2,hp:6500,spd:15,turn:.34,mt:[.34,.2,-.3],bar:3,dmg:70,rl:8,rng:360,tor:0,td:0,col:0x5f7384,fn:2,pts:300,ds:'Nine-gun broadsides and solid armor.'},
bb:{n:'Battleship',L:62,B:8,hp:10000,spd:12,turn:.24,mt:[.35,.2,-.25,-.38],bar:2,dmg:180,rl:12,rng:420,tor:0,td:0,col:0x566b7c,fn:1,pts:450,ds:'Heavy shells, long range, slow to turn.'},
sb:{n:'Super Battleship',L:76,B:9.5,hp:14000,spd:10,turn:.18,mt:[.36,.22,-.24,-.38],bar:3,dmg:200,rl:16,rng:470,tor:0,td:0,col:0x4a5e70,fn:2,pts:700,ds:'Twelve huge guns. A floating fortress.'}};
const KS=Object.keys(SH);
const mx=f=>Math.max(...KS.map(k=>f(SH[k])));
const STATS=[['Armor',c=>c.hp],['Speed',c=>c.spd],['Guns',c=>c.mt.length*c.bar*c.dmg/c.rl],['Range',c=>c.rng],['Torpedo',c=>c.tor*c.td]];
// renderer
const cv=$('c'),rd=new THREE.WebGLRenderer({canvas:cv,antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x9fc0d6,700,2000);
const cam=new THREE.PerspectiveCamera(58,1,1,5000);
scene.add(new THREE.HemisphereLight(0xcfe6f5,0x1a3342,.95));
const sun=new THREE.DirectionalLight(0xfff1d6,1.15);sun.position.set(-50,60,-40);scene.add(sun);
const sky=new THREE.Mesh(new THREE.SphereGeometry(3500,24,12),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'varying vec3 p;void main(){vec3 d=normalize(p);float h=max(d.y,0.);vec3 c=mix(vec3(.62,.75,.84),vec3(.16,.38,.74),pow(h,.45));float s=max(dot(d,normalize(vec3(-.5,.6,-.4))),0.);c+=vec3(1.,.85,.6)*(pow(s,700.)*3.+pow(s,8.)*.22);gl_FragColor=vec4(c,1.);}'}));
scene.add(sky);
const wg=new THREE.PlaneGeometry(4200,4200,200,200);wg.rotateX(-Math.PI/2);
const wm=new THREE.ShaderMaterial({uniforms:{t:{value:0},cam:{value:new THREE.Vector3()}},
vertexShader:'uniform float t;varying vec3 vW;varying vec3 vN;float h(vec2 p){return (sin(p.x*.05+t*.9)*1.1+sin(p.y*.07-t*.7)*.9+sin((p.x+p.y)*.11+t*1.3)*.5+sin((p.x-p.y)*.23-t*1.9)*.25)*.4;}void main(){vec4 w=modelMatrix*vec4(position,1.);float e=1.;float y=h(w.xz);vN=normalize(vec3(-(h(w.xz+vec2(e,0.))-y),1.,-(h(w.xz+vec2(0.,e))-y)));w.y=y;vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',
fragmentShader:'uniform vec3 cam;varying vec3 vW;varying vec3 vN;void main(){vec3 V=normalize(cam-vW);vec3 N=normalize(vN);float f=pow(1.-max(dot(N,V),0.),3.);vec3 c=mix(vec3(.02,.13,.21),vec3(.06,.33,.4),.5+.5*N.x*3.);vec3 L=normalize(vec3(-.5,.6,-.4));float sp=pow(max(dot(N,normalize(L+V)),0.),90.)*1.4;c=mix(c,vec3(.55,.72,.85),f*.75)+vec3(1.,.9,.7)*sp;float d=length(vW.xz-cam.xz);c=mix(c,vec3(.62,.75,.84),smoothstep(500.,2000.,d));gl_FragColor=vec4(c,1.);}'});
const water=new THREE.Mesh(wg,wm);water.frustumCulled=false;scene.add(water);
// ship builder
const mt=c=>new THREE.MeshLambertMaterial({color:c});
function build(k,col){const c=SH[k],g=new THREE.Group(),L=c.L,B=c.B,H=B*.5,y0=H*.55;
const sp=new THREE.Shape();sp.moveTo(-L/2,-B/2);sp.lineTo(L*.2,-B/2);sp.quadraticCurveTo(L*.42,-B/2,L/2,0);sp.quadraticCurveTo(L*.42,B/2,L*.2,B/2);sp.lineTo(-L/2,B/2);sp.closePath();
const hg=new THREE.ExtrudeGeometry(sp,{depth:H,bevelEnabled:false});hg.rotateX(-Math.PI/2);hg.translate(0,-H*.45,0);g.add(new THREE.Mesh(hg,mt(col)));
const add=(geo,cc,x,y,z)=>{const m=new THREE.Mesh(geo,mt(cc));m.position.set(x,y,z);g.add(m);return m};
add(new THREE.BoxGeometry(L*.72,.15,B*.72),0x9a8662,-L*.05,y0+.05,0);
add(new THREE.BoxGeometry(L*.16,B*.7,B*.5),0x8d9aa4,-L*.04,y0+B*.35,0);
add(new THREE.BoxGeometry(L*.1,B*.3,B*.6),0x7b8994,-L*.02,y0+B*.85,0);
add(new THREE.CylinderGeometry(.12,.12,B*.9),0x333,-L*.03,y0+B*1.5,0);
for(let i=0;i<c.fn;i++)add(new THREE.CylinderGeometry(B*.1,B*.13,B*.5),0x222a30,-L*.17-i*L*.09,y0+B*.25,0);
g.userData.tur=[];
c.mt.forEach(f=>{const t=new THREE.Group();t.position.set(f*L,y0+B*.1,0);
const b=new THREE.Mesh(new THREE.CylinderGeometry(B*.22,B*.25,B*.22,12),mt(0x6c7a84));t.add(b);
for(let j=0;j<c.bar;j++){const z=(j-(c.bar-1)/2)*B*.15,m=new THREE.Mesh(new THREE.CylinderGeometry(.14,.16,B*.6,6),mt(0x23292e));m.rotation.z=Math.PI/2;m.position.set(B*.3,B*.1,z);t.add(m)}
g.add(t);g.userData.tur.push(t)});
if(c.tor)[-1,1].forEach(s=>add(new THREE.BoxGeometry(B*.8,.4,.5),0x444c52,-L*.3,y0+.3,s*B*.4));
return g}
// state
let mode='menu',P,ships=[],shells=[],torps=[],pf=[],wave=1,score=0,thr=0,cy=0,cp=.1,cd=80,fov=58,kills=0,spawnT=0,msgT=0,overT=0,prevShip,prevK=0,clk=0;
const keys={},sphG=new THREE.SphereGeometry(1,8,6),shG=new THREE.SphereGeometry(.45,6,5),shM=new THREE.MeshBasicMaterial({color:0xffd37a});
function puff(p,col,sz,life,gr,vy,op){const m=new THREE.Mesh(sphG,new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op||.8,depthWrite:false}));m.position.copy(p);m.scale.setScalar(sz);scene.add(m);pf.push({m,l:life,L:life,gr,vy:vy||0,sz,op:op||.8})}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function mk(k,team,x,z,h){const c=SH[k],m=build(k,team?0x7a4d48:c.col);m.rotation.order='YXZ';scene.add(m);
const s={k,c,team,m,x,z,h,v:0,thr:team?2:0,rud:0,rin:0,hp:c.hp,alive:1,rl:0,tr:0,sink:0,ax:x,az:z,side:R()<.5?1:-1,sm:0,ph:R()*9};
if(team){const e=document.createElement('div');e.className='eb';e.innerHTML=c.n+'<div class="bar"><i></i></div>';$('hud').appendChild(e);s.eb=e}
ships.push(s);return s}
function spawnWave(){const n=Math.min(2+wave,7);for(let i=0;i<n;i++){const k=KS[Math.min(4,Math.floor(R()*(1+Math.min(wave,4))))];const a=R()*TAU,d=700+R()*300;mk(k,1,P.x+Math.cos(a)*d,P.z+Math.sin(a)*d,a+Math.PI)}}
function msg(t){$('msg').textContent=t;msgT=1.8}
function start(k){clear();if(prevShip){scene.remove(prevShip);prevShip=null}P=mk(k,0,0,0,0);thr=0;wave=1;score=0;cy=0;cp=.1;spawnWave();mode='play';$('menu').hidden=true;$('over').hidden=true;$('hud').hidden=false;$('nm').textContent=P.c.n;msg('Wave 1')}
function clear(){ships.forEach(s=>{scene.remove(s.m);s.eb&&s.eb.remove()});shells.forEach(s=>scene.remove(s.m));torps.forEach(s=>scene.remove(s.m));ships=[];shells=[];torps=[]}
function showPrev(k){prevK=k;if(prevShip)scene.remove(prevShip);prevShip=build(SH[k].n?k:'dd',SH[k].col);scene.add(prevShip)}
function menu(){clear();mode='menu';$('menu').hidden=false;$('over').hidden=true;$('hud').hidden=true;showPrev(prevK&&SH[prevK]?prevK:'bb');if(document.pointerLockElement)document.exitPointerLock()}
KS.forEach(k=>{const c=SH[k],b=document.createElement('button');b.className='card';
b.innerHTML='<b>'+c.n+'</b><p>'+c.ds+'</p>'+STATS.map(([l,f])=>'<div class="st"><span>'+l+'</span><div class="bar"><i style="width:'+Math.round(f(c)/mx(f)*100)+'%"></i></div></div>').join('');
b.onmouseenter=()=>showPrev(k);b.onclick=()=>start(k);$('cards').appendChild(b)});
$('again').onclick=menu;
// combat
function fireMain(s,tx,tz){if(s.rl>0||!s.alive)return;const c=s.c,en=s.team?1.35:1;s.rl=c.rl*(s.team?1.3:1);
s.m.updateMatrixWorld(true);
s.m.userData.tur.forEach(t=>{for(let j=0;j<c.bar;j++){const o=t.localToWorld(V(c.B*.65,c.B*.1,(j-(c.bar-1)/2)*c.B*.15));
const d=Math.hypot(tx-o.x,tz-o.z),sp=2+d*.02*en,T=d/190+.6;
const ex=tx+(R()-.5)*2*sp,ez=tz+(R()-.5)*2*sp,vx=(ex-o.x)/T,vz=(ez-o.z)/T,vy=(.5*G*T*T-o.y)/T;
const m=new THREE.Mesh(shG,shM);m.position.copy(o);scene.add(m);shells.push({m,x:o.x,y:o.y,z:o.z,vx,vy,vz,team:s.team,dmg:c.dmg*(s.team?.75:1),src:s});
puff(o,0xffe2a0,c.B*.5,.25,2,0,.9);puff(o,0x888888,c.B*.4,1,3,2,.5)}})}
function fireTor(s){if(s.tr>0||!s.c.tor||!s.alive)return;s.tr=25*(s.team?1.4:1);const n=s.c.tor;
for(let i=0;i<n;i++){const a=s.h+(i-(n-1)/2)*.045,m=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,3.5,6),mt(0xdddddd));m.rotation.order='YXZ';m.rotation.set(0,a,Math.PI/2);m.position.set(s.x,-.4,s.z);scene.add(m);torps.push({m,x:s.x+Math.cos(s.h)*s.c.L*.3,z:s.z-Math.sin(s.h)*s.c.L*.3,a,team:s.team,dmg:s.c.td,life:30,src:s})}}
function dmg(s,d,p,src){if(!s.alive)return;s.hp-=d;puff(p,0xff8a2a,6,.5,2.5,0,.9);puff(p,0x333333,5,2,3,5,.6);
if(src===P&&s!==P)msg('HIT -'+Math.round(d));if(s===P)flash();
if(s.hp<=0)die(s,src)}
function flash(){document.body.style.boxShadow='inset 0 0 90px rgba(239,91,76,.5)';setTimeout(()=>document.body.style.boxShadow='',150)}
function die(s,src){s.alive=false;s.sink=0;for(let i=0;i<8;i++)puff(V(s.x+(R()-.5)*s.c.L*.6,4,s.z+(R()-.5)*s.c.L*.6),i%2?0xff7a1a:0x222222,s.c.B*1.4,2.5,2.5,6);
if(s.eb){s.eb.remove();s.eb=null}
if(s===P){overT=2.5}else if(src===P){score+=s.c.pts;msg('DESTROYED '+s.c.n.toUpperCase()+' +'+s.c.pts)}}
const loc=(s,x,z)=>{const dx=x-s.x,dz=z-s.z,c=Math.cos(s.h),n=Math.sin(s.h);return[dx*c-dz*n,dx*n+dz*c]};
function upd(s,dt,t){const c=s.c;if(!s.alive){s.sink+=dt;s.m.position.y-=dt*(1.5+s.sink);s.m.rotation.x+=dt*.12*(s.side);s.m.rotation.z+=dt*.05;s.v*=.98;s.x+=Math.cos(s.h)*s.v*dt;s.z-=Math.sin(s.h)*s.v*dt;s.m.position.x=s.x;s.m.position.z=s.z;return}
const tg=s.thr>=0?s.thr/4*c.spd:-.3*c.spd;s.v+=(tg-s.v)*Math.min(1,dt*.35);s.rud+=(s.rin-s.rud)*Math.min(1,dt*2);
s.h+=s.rud*c.turn*dt*(.25+.75*Math.abs(s.v)/c.spd)*(s.v<0?-1:1);s.x+=Math.cos(s.h)*s.v*dt;s.z-=Math.sin(s.h)*s.v*dt;
const r=Math.hypot(s.x,s.z);if(r>1500){s.x*=1500/r;s.z*=1500/r}
s.rl-=dt;s.tr-=dt;const m=s.m;m.position.set(s.x,Math.sin(t*1.1+s.ph)*.25,s.z);m.rotation.y=s.h;m.rotation.x=-s.rud*s.v/c.spd*.12+Math.sin(t*.9+s.ph)*.015;m.rotation.z=Math.sin(t*.7+s.ph)*.012;
const a=Math.atan2(-(s.az-s.z),s.ax-s.x);m.userData.tur.forEach(u=>u.rotation.y=a-s.h);
if(Math.abs(s.v)>1.5&&(s.sm-=dt)<0){s.sm=.18;puff(V(s.x-Math.cos(s.h)*c.L*.5,.3,s.z+Math.sin(s.h)*c.L*.5),0xffffff,c.B*.5,1.6,2.5,0,.35)}
if(s.hp<c.hp*.5&&(s.sm-=dt)<0){s.sm=.12;puff(V(s.x,c.B*1.1,s.z),0x2a2a2a,c.B*.35,2.5,3,5,.55)}}
function ai(s,dt){if(!P.alive){s.thr=1;return}const dx=P.x-s.x,dz=P.z-s.z,d=Math.hypot(dx,dz),want=s.c.rng*.55,to=Math.atan2(-dz,dx);
const off=d<want?s.side*1.45:d<want*1.6?s.side*.7:0,da=(((to+off-s.h+Math.PI)%TAU)+TAU)%TAU-Math.PI;s.rin=cl(da*2,-1,1);s.thr=d<want*.6?1:s.k==='dd'?4:3;
const T=d/190+.6;s.ax=P.x+Math.cos(P.h)*P.v*T*(.7+R()*.3);s.az=P.z-Math.sin(P.h)*P.v*T*(.7+R()*.3);
if(d<s.c.rng*.95)fireMain(s,s.ax,s.az);
const ta=(((to-s.h+Math.PI)%TAU)+TAU)%TAU-Math.PI;if(s.c.tor&&d<420&&Math.abs(ta)<.22)fireTor(s)}
// input
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();keys[k]=1;if(mode!=='play'||!P.alive)return;
if(k==='w'||k==='arrowup')thr=Math.min(4,thr+1);if(k==='s'||k==='arrowdown')thr=Math.max(-1,thr-1);if(k==='x')thr=0;
if(k==='t')fireTor(P);if(k===' ')e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
addEventListener('mousemove',e=>{if(mode!=='play')return;if(document.pointerLockElement===cv||e.buttons&2){const z=fov<40?.4:1;cy-=e.movementX*.0025*z;cp=cl(cp+e.movementY*.0022*z,.012,.55)}});
cv.addEventListener('mousedown',e=>{if(mode!=='play')return;if(e.button===0){try{if(!document.pointerLockElement)cv.requestPointerLock()}catch(x){}keys.fire=1}});
addEventListener('mouseup',()=>keys.fire=0);cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('wheel',e=>{cd=cl(cd+e.deltaY*.05,45,140)});
function resize(){rd.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
// loop
const mm=$('mm').getContext('2d');let last=performance.now(),acc=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1e3);last=now;clk+=dt;wm.uniforms.t.value=clk;
